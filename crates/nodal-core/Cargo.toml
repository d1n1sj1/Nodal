[package]
name = "nodal-core"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Nodal circuit simulation core"

[dependencies]
# Pinned: mna.rs reads the pivot as the last entry of each U column in faer's simplicial LU.
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "large"
harness = false
